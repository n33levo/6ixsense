<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6ixsense</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: radial-gradient(120% 120% at 80% 20%, #101537 0%, #050610 45%, #010104 100%);
      --accent: #f272ff;
      --accent-soft: rgba(242, 114, 255, 0.2);
      --glow: rgba(124, 236, 255, 0.4);
      --text: #f3f6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Mono", "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      overflow: hidden;
    }

    main {
      position: relative;
      width: min(560px, 90vw);
      padding: clamp(1.5rem, 5vw, 3.5rem);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      background: rgba(5, 6, 16, 0.68);
      border: 1px solid rgba(126, 150, 255, 0.2);
      box-shadow:
        0 0 42px rgba(98, 141, 255, 0.25),
        inset 0 0 24px rgba(73, 102, 255, 0.18);
      display: grid;
      gap: 1.5rem;
    }

    .stars,
    .stars::before,
    .stars::after {
      content: "";
      position: absolute;
      inset: -40vh;
      background-image:
        radial-gradient(1px 1px at 20% 10%, rgba(255, 255, 255, 0.9), transparent),
        radial-gradient(1px 1px at 80% 30%, rgba(124, 236, 255, 0.8), transparent),
        radial-gradient(1px 1px at 50% 70%, rgba(242, 114, 255, 0.8), transparent),
        radial-gradient(1px 1px at 10% 80%, rgba(255, 255, 255, 0.5), transparent),
        radial-gradient(1px 1px at 90% 50%, rgba(150, 255, 210, 0.9), transparent);
      animation: driftStars linear infinite;
      opacity: 0.4;
    }

    .stars {
      animation-duration: 90s;
    }

    .stars::before {
      animation-duration: 120s;
      transform: scale(1.2);
      opacity: 0.3;
    }

    .stars::after {
      animation-duration: 150s;
      transform: scale(0.9);
      opacity: 0.45;
    }

    @keyframes driftStars {
      from {
        transform: translate3d(0, 0, 0);
      }
      to {
        transform: translate3d(-10%, -15%, 0);
      }
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      position: relative;
      color: var(--text);
    }

    h1::after,
    h1::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      mix-blend-mode: screen;
      opacity: 0.6;
    }

    h1::before {
      color: rgba(124, 236, 255, 0.8);
      animation: glitch 3.6s infinite linear alternate-reverse;
    }

    h1::after {
      color: rgba(242, 114, 255, 0.8);
      animation: glitch 2.4s infinite linear alternate;
    }

    @keyframes glitch {
      0%, 100% {
        clip-path: inset(0% 0 0% 0);
        transform: translate(0);
      }
      10% {
        clip-path: inset(15% 0 10% 0);
        transform: translate(-2px, 1px);
      }
      20% {
        clip-path: inset(45% 0 20% 0);
        transform: translate(1px, -1px);
      }
      30% {
        clip-path: inset(25% 0 40% 0);
        transform: translate(-1px, 1px);
      }
      40% {
        clip-path: inset(65% 0 5% 0);
        transform: translate(2px, -2px);
      }
      50% {
        clip-path: inset(5% 0 75% 0);
        transform: translate(-1px, 2px);
      }
      60% {
        clip-path: inset(35% 0 20% 0);
        transform: translate(1px, -1px);
      }
      70% {
        clip-path: inset(25% 0 45% 0);
        transform: translate(-2px, 2px);
      }
      80% {
        clip-path: inset(55% 0 15% 0);
        transform: translate(1px, -2px);
      }
      90% {
        clip-path: inset(15% 0 65% 0);
        transform: translate(-1px, 1px);
      }
    }

    .message {
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      line-height: 1.6;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      display: flex;
      flex-wrap: wrap;
      gap: 0.2em;
      justify-content: center;
    }

    .letter {
      position: relative;
      display: inline-block;
      padding: 0.16em 0.1em 0.06em;
      color: var(--text);
      text-shadow:
        0 0 18px rgba(124, 236, 255, 0.3),
        0 0 12px rgba(242, 114, 255, 0.2);
      transition: transform 240ms ease, text-shadow 240ms ease, color 240ms ease;
      animation: pulse 5.2s ease-in-out infinite;
      animation-delay: calc(var(--delay) * 0.15s);
    }

    .letter::after {
      content: "";
      position: absolute;
      inset: 70% 10% -10% 10%;
      background: radial-gradient(circle at 50% 0%, rgba(124, 236, 255, 0.5), transparent 73%);
      opacity: 0;
      transition: opacity 200ms ease;
    }

    .letter:hover {
      transform: translateY(-12%);
      color: var(--accent);
      text-shadow:
        0 0 24px rgba(242, 114, 255, 0.6),
        0 0 42px rgba(124, 236, 255, 0.65);
    }

    .letter:hover::after {
      opacity: 0.8;
    }

    @keyframes pulse {
      0%, 100% {
        transform: translateY(0) rotateX(0deg);
      }
      40% {
        transform: translateY(-4%) rotateX(8deg);
      }
      60% {
        transform: translateY(2%) rotateX(-4deg);
      }
    }

    .status {
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      color: rgba(203, 210, 255, 0.7);
    }

    .status button {
      margin-top: 0.8rem;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: 1px solid rgba(242, 114, 255, 0.35);
      background: rgba(124, 236, 255, 0.12);
      color: var(--text);
      font: inherit;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 160ms ease, background 200ms ease;
    }

    .status button::before {
      content: "";
      position: absolute;
      inset: -120% 45% 120% -45%;
      background: linear-gradient(120deg, transparent, rgba(242, 114, 255, 0.45), transparent);
      transform: translateX(-120%) rotate(12deg);
      transition: transform 320ms ease;
    }

    .status button:hover {
      transform: translateY(-1px);
      background: rgba(124, 236, 255, 0.18);
    }

    .status button:hover::before {
      transform: translateX(130%) rotate(12deg);
    }

    .aurora {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(124, 236, 255, 0.12), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(242, 114, 255, 0.12), transparent 55%),
        radial-gradient(circle at 50% 80%, rgba(102, 255, 204, 0.08), transparent 50%);
      filter: blur(40px);
      mix-blend-mode: screen;
      animation: auroraShift 18s ease-in-out infinite alternate;
    }

    @keyframes auroraShift {
      0% {
        transform: translate3d(0, 0, 0);
      }
      100% {
        transform: translate3d(-3%, -5%, 0);
      }
    }

    .orbits {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .orbit {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(124, 236, 255, 0.1);
      transform-origin: center;
      animation: orbitSpin var(--duration) linear infinite;
    }

    .orbit:nth-child(1) {
      transform: scale(1.05);
      --duration: 38s;
    }

    .orbit:nth-child(2) {
      transform: scale(1.25);
      --duration: 52s;
    }

    .orbit:nth-child(3) {
      transform: scale(1.45);
      --duration: 67s;
    }

    @keyframes orbitSpin {
      to {
        transform: rotate(360deg) scale(var(--scale, 1));
      }
    }

    footer {
      font-size: 0.75rem;
      text-align: center;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(203, 210, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <div class="orbits" aria-hidden="true">
      <div class="orbit"></div>
      <div class="orbit"></div>
      <div class="orbit"></div>
    </div>
    <h1 data-text="6IXSENSE">6IXSENSE</h1>
    <p class="message" data-message="Building something big. Check in soon."></p>
    <div class="status" id="sound-status">
      <div>Sound status: <span id="sound-label">standby</span></div>
      <button id="sound-toggle" type="button">Activate soundscape</button>
    </div>
    <footer>⟢ INITIATING 6IXSENSE SIGNAL ⟣</footer>
  </main>

  <script>
    const messageEl = document.querySelector(".message");
    const rawMessage = messageEl.dataset.message;
    messageEl.innerHTML = "";

    const createLetterSpan = (char, index) => {
      const span = document.createElement("span");
      span.textContent = char;
      span.className = "letter";
      span.style.setProperty("--delay", index);
      span.addEventListener("mousemove", (event) => {
        const rect = span.getBoundingClientRect();
        const offsetX = event.clientX - rect.left;
        const offsetY = event.clientY - rect.top;
        const percentX = (offsetX / rect.width) - 0.5;
        const percentY = (offsetY / rect.height) - 0.5;
        span.style.transform = `translate(${percentX * 8}px, ${percentY * 8}px) scale(1.08)`;
      });
      span.addEventListener("mouseleave", () => {
        span.style.transform = "";
      });
      return span;
    };

    [...rawMessage].forEach((char, index) => {
      if (char === " ") {
        const spacer = document.createElement("span");
        spacer.style.width = "0.6em";
        spacer.style.display = "inline-block";
        messageEl.appendChild(spacer);
      } else {
        messageEl.appendChild(createLetterSpan(char, index));
      }
    });

    const soundToggle = document.getElementById("sound-toggle");
    const soundLabel = document.getElementById("sound-label");
    let audioCtx;
    let masterGain;
    let isPlaying = false;

    const createAmbientPad = (ctx) => {
      const padGain = ctx.createGain();
      padGain.gain.setValueAtTime(0.0001, ctx.currentTime);
      padGain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 5);

      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(950, ctx.currentTime);
      filter.Q.value = 1.2;

      const oscillators = [0.48, 0.97, 1.92].map((ratio, idx) => {
        const osc = ctx.createOscillator();
        osc.type = idx === 0 ? "sawtooth" : "triangle";
        const baseFreq = 55 * ratio;
        osc.frequency.setValueAtTime(baseFreq, ctx.currentTime);

        const lfo = ctx.createOscillator();
        lfo.frequency.setValueAtTime(0.03 + idx * 0.012, ctx.currentTime);

        const lfoGain = ctx.createGain();
        lfoGain.gain.setValueAtTime(5 + idx * 8, ctx.currentTime);

        lfo.connect(lfoGain).connect(osc.frequency);
        lfo.start();
        return { osc, lfo };
      });

      oscillators.forEach(({ osc }) => osc.connect(filter));
      filter.connect(padGain).connect(masterGain);
      oscillators.forEach(({ osc }) => osc.start());
    };

    const createCosmicRumble = (ctx) => {
      const bufferSize = ctx.sampleRate * 4;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let lastOut = 0;
      for (let i = 0; i < bufferSize; i += 1) {
        const white = Math.random() * 2 - 1;
        data[i] = (lastOut + (0.02 * white)) / 1.02;
        lastOut = data[i];
        data[i] *= 3.5;
      }

      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = "bandpass";
      noiseFilter.frequency.setValueAtTime(180, ctx.currentTime);
      noiseFilter.Q.value = 0.7;

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.0001, ctx.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.04, ctx.currentTime + 6);

      const noiseLfo = ctx.createOscillator();
      noiseLfo.frequency.setValueAtTime(0.08, ctx.currentTime);
      const noiseLfoGain = ctx.createGain();
      noiseLfoGain.gain.setValueAtTime(70, ctx.currentTime);
      noiseLfo.connect(noiseLfoGain).connect(noiseFilter.frequency);
      noiseLfo.start();

      const slowPan = ctx.createOscillator();
      slowPan.frequency.setValueAtTime(0.02, ctx.currentTime);
      const panner = ctx.createStereoPanner();
      const panGain = ctx.createGain();
      panGain.gain.setValueAtTime(0.6, ctx.currentTime);
      slowPan.connect(panGain).connect(panner.pan);
      slowPan.start();

      noise.connect(noiseFilter).connect(panner).connect(noiseGain).connect(masterGain);
      noise.start();
    };

    const startSoundscape = async () => {
      if (isPlaying) {
        return;
      }

      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();

      masterGain = masterGain || audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      masterGain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 8);
      masterGain.connect(audioCtx.destination);

      createAmbientPad(audioCtx);
      createCosmicRumble(audioCtx);

      isPlaying = true;
      soundLabel.textContent = "online";
      soundToggle.textContent = "Sound active";
      soundToggle.disabled = true;
    };

    soundToggle.addEventListener("click", startSoundscape);
    window.addEventListener("pointerdown", startSoundscape, { once: true });
    window.addEventListener("keydown", startSoundscape, { once: true });
  </script>
</body>
</html>
